let current=0;

function selectVariant(n){
 current=n;
 document.querySelectorAll(".tab").forEach((b,i)=>{
  b.classList.toggle("active",i===n);
 });
 document.getElementById("search").value="";
 render();
}

function render(){
 const variant=data[current];
 const query=document.getElementById("search").value.toLowerCase().trim();
 document.getElementById("info").textContent=
 "Номер варианта: "+variant.id+" · Всего заданий: 25";

 const list=document.getElementById("tasks");
 list.innerHTML="";

 let count=0;

 variant.tasks.forEach((task,index)=>{
  const number=index+1;
  const text=(number+" "+task[0]+" "+task[1]+" "+task[2]).toLowerCase();

  if(query && !text.includes(query)) return;

  count++;

  const card=document.createElement("div");
  card.className="task";

  const num=document.createElement("div");
  num.className="num";
  num.textContent="ЗАДАНИЕ №"+number;

  const title=document.createElement("h3");
  title.textContent=task[0];

  const solution=document.createElement("div");
  solution.className="solution";
  solution.textContent=task[1];

  const answer=document.createElement("div");
  answer.className="answer"+(task[3]?" unknown":"");
  answer.textContent="Ответ: "+task[2];

  card.append(num,title,solution,answer);
  list.appendChild(card);
 });

 if(count===0){
  list.innerHTML='<div class="empty">Ничего не найдено</div>';
 }
}

render();
</script>
